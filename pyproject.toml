[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "solana-chainkit"
version = "0.1.0"
description = "Production-grade building blocks for USDC payments on Solana: exact amounts, safe transfers, deposit detection, RPC failover and verified Pyth prices."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Peter Nzomo", email = "pmzomo@gmail.com" }]
maintainers = [{ name = "Peter Nzomo", email = "pmzomo@gmail.com" }]
keywords = ["solana", "usdc", "payments", "stablecoin", "spl-token", "pyth", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "solders>=0.21,<1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "types-requests", "build", "twine"]

[project.urls]
Homepage = "https://github.com/pmzomo/chainkit"
Source = "https://github.com/pmzomo/chainkit"
Issues = "https://github.com/pmzomo/chainkit/issues"
Changelog = "https://github.com/pmzomo/chainkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/chainkit"]

[tool.hatch.build.targets.sdist]
include = ["src/chainkit", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "SECURITY.md",
           "CONTRIBUTING.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: talks to public Solana RPC and Pyth (run with CHAINKIT_LIVE=1)"]

[tool.coverage.run]
source = ["chainkit"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"examples/**" = ["S", "T201"]
"src/chainkit/constants.py" = ["S105"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/chainkit"]
